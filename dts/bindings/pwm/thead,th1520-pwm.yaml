description: T-Head TH1520 6-channel PWM controller

compatible: "thead,th1520-pwm"

include: [pwm-controller.yaml, pinctrl-device.yaml, base.yaml]

properties:
  reg:
    required: true

  clock-frequency:
    type: int
    required: true
    description: Input clock frequency in Hz (typically 100 MHz on TH1520)

  "#pwm-cells":
    const: 3

pwm-cells:
  - channel
  - period
  - flags

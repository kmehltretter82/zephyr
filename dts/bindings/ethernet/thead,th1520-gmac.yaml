description: T-Head TH1520 Synopsys DesignWare Gigabit Ethernet MAC (DW_GMAC)

compatible: "thead,th1520-gmac"

include: [ethernet-controller.yaml, base.yaml]

properties:
  reg:
    required: true
    description: GMAC MMIO base address and TH1520 GMAC APB clock glue base address

  interrupts:
    required: true

  phy-addr:
    type: int
    default: 1
    description: MDIO PHY address of the external RGMII PHY (RTL8211F)

# SPDX-License-Identifier: Apache-2.0

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_PRINTK=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT24=y
CONFIG_SPI=y
CONFIG_COUNTER=y
CONFIG_WATCHDOG=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Track 1: PWM, Pinctrl, PVT Sensor, RTC, AXI DMA
CONFIG_PWM=y
CONFIG_PINCTRL=y
CONFIG_SENSOR=y
CONFIG_RTC=y
CONFIG_DMA=y
CONFIG_DMA_DW_AXI=y

# Track 2: Gigabit Ethernet + TCP/IP, Bluetooth H4 HCI, eMMC Disk
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=n
CONFIG_NET_UDP=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_ACCEPT_MISMATCH_L3_L2_ADDR=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_NET_RX_STACK_SIZE=4096
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

CONFIG_BT=y
CONFIG_BT_HCI=y
CONFIG_BT_H4=y
CONFIG_BT_HOST_CRYPTO=n
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_RX_STACK_SIZE=4096

CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y

# Track 3: MikroE Click Boards (BME280 Weather Click + MCP2518FD CAN-FD Click)
CONFIG_BME280=y
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_MCP251XFD=y
CONFIG_CAN_MCP251XFD_INT_THREAD_STACK_SIZE=2048

# Track 4: TH1520 Hardware Mailbox IPC
CONFIG_MBOX=y
